<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Tibiazinho MMO</title>
<style>
body{margin:0;background:#111;color:#ddd;font:13px monospace;display:flex;justify-content:center}
#g{width:100%;max-width:960px;position:relative}
canvas{width:100%;display:block;image-rendering:pixelated;background:#000;border:2px solid #543;box-sizing:border-box}
#hud{display:flex;gap:6px;align-items:center;padding:4px;background:#2b2118;flex-wrap:wrap}
.bar{width:110px;height:12px;background:#222;border:1px solid #000}.bar i{display:block;height:100%;width:100%;background:#c22}.bar.x i{background:#38c}
#log{height:110px;overflow:auto;background:#1b150f;padding:4px}
#ci{width:100%;box-sizing:border-box;background:#000;color:#fff;border:1px solid #543;padding:6px;font:inherit}
#login{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;z-index:5;text-align:center}
#login input,#login button{font:inherit;padding:8px;background:#222;color:#fff;border:1px solid #765}
.sw{width:28px;height:28px;border:2px solid transparent;cursor:pointer;display:inline-block;margin:2px}.sw.s{border-color:#fff}
#pad{display:none;position:fixed;left:8px;bottom:180px;grid:repeat(3,48px)/repeat(3,48px);gap:2px;z-index:4}
#pad b{background:#fff3;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;user-select:none;touch-action:none}
@media(pointer:coarse){#pad{display:grid}}
</style></head><body><div id="g">
<canvas id="c" width="480" height="352"></canvas>
<div id="hud"><div class="bar"><i id="hb"></i></div><div class="bar x"><i id="xb"></i></div><span id="ht"></span></div>
<div id="log"></div><input id="ci" maxlength="100" placeholder="Enter para conversar">
<div id="pad"><b data-k="arrowup" style="grid-area:1/2">▲</b><b data-k="arrowleft" style="grid-area:2/1">◀</b><b data-k="arrowright" style="grid-area:2/3">▶</b><b data-k="arrowdown" style="grid-area:3/2">▼</b></div>
<div id="login"><h2>⚔ Tibiazinho MMO</h2><input id="ni" maxlength="14" placeholder="Nome do personagem"><div id="sw"></div><button id="go">Jogar</button><small id="st"></small><small>WASD/setas: andar · clique no monstro: atacar · Enter: chat</small></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ===== CONFIGURAÇÃO ONLINE (Firebase Realtime Database) =====
// Cole aqui a config do seu projeto Firebase. Se databaseURL ficar vazio, o jogo roda offline com bots.
const FB={apiKey: "AIzaSyBtC0IanYDj9cx4JaoZV9pzV86WSdOSHlQ",
  authDomain: "mmorpg-a37e3.firebaseapp.com",
  databaseURL: "https://mmorpg-a37e3-default-rtdb.firebaseio.com",
  projectId: "mmorpg-a37e3",
  storageBucket: "mmorpg-a37e3.firebasestorage.app",
  messagingSenderId: "230052295995",
  appId: "1:230052295995:web:2334e7a4aeff790452331e",
  measurementId: "G-V7TFFPJ60R"};
// ============================================================
const T=32,W=96,H=96,VW=15,VH=11,CX=48,CY=48;
const online=!!FB.databaseURL&&typeof firebase!=="undefined";
const c=document.getElementById("c"),x=c.getContext("2d"),$=i=>document.getElementById(i);
x.imageSmoothingEnabled=false;
const cl=(a,m)=>Math.max(-m,Math.min(m,a));
function rnd(a,b,s){let h=Math.imul(a*374761393+b*668265263+s*1274126177,1103515245);h^=h>>>13;h=Math.imul(h,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vn(a,b,s,f){const xi=Math.floor(a/f),yi=Math.floor(b/f),xf=a/f-xi,yf=b/f-yi,sm=t=>t*t*(3-2*t),
p=rnd(xi,yi,s),q=rnd(xi+1,yi,s),r=rnd(xi,yi+1,s),w=rnd(xi+1,yi+1,s),u=sm(xf),v=sm(yf);return p+(q-p)*u+(r-p)*v+(p-q-r+w)*u*v}
// ----- mapa (mesma seed = mesmo mundo para todos) -----
const map=[];
for(let y=0;y<H;y++){map[y]=[];for(let a=0;a<W;a++){
 const d=Math.max(Math.abs(a-CX),Math.abs(y-CY))/CX;let e=vn(a,y,1,16)*.7+vn(a,y,2,6)*.3-d*d*.5+.12;if(d<.25)e+=.2;
 map[y][a]=e<.28?0:e<.34?1:(vn(a,y,3,9)>.68&&e>.45)?4:(vn(a,y,4,7)>.55&&rnd(a,y,5)>.6)?3:2}}
for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++)map[CY+dy][CX+dx]=5;
function house(x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let a=x0;a<=x1;a++)map[y][a]=(a==x0||a==x1||y==y0||y==y1)?6:7;map[y1][(x0+x1)>>1]=7}
house(CX-5,CY-5,CX-2,CY-2);house(CX+2,CY-5,CX+5,CY-2);
const solid=t=>t==0||t==3||t==4||t==6,safeT=t=>t==5||t==7;
// ----- sprites de tiles (pixel art gerado) -----
function mk(f){const e=document.createElement("canvas");e.width=e.height=T;const g=e.getContext("2d");f(g);return e}
function sp(g,cols,n,w,h){for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];g.fillRect(Math.random()*(T-w)|0,Math.random()*(T-h)|0,w,h)}}
const base=(g,col)=>{g.fillStyle=col;g.fillRect(0,0,T,T)};
const tiles=[[],[],[],[],[],[],[],[]];
for(let v=0;v<3;v++){
 tiles[0][v]=mk(g=>{base(g,"#2a5fa8");sp(g,["#4a82c8","#1f4d90"],8,6,1)});
 tiles[1][v]=mk(g=>{base(g,"#d9c27a");sp(g,["#c4ab5f","#e8d58f"],14,2,2)});
 tiles[2][v]=mk(g=>{base(g,"#3c8a2e");sp(g,["#2f7424","#4aa23a"],16,2,2)});
 tiles[3][v]=mk(g=>{base(g,"#3c8a2e");sp(g,["#2f7424"],8,2,2);g.fillStyle="#6b4423";g.fillRect(13,18,6,11);g.fillStyle="#1f5e1a";g.fillRect(6,4,20,16);g.fillRect(4,8,24,10);g.fillStyle="#2f7d27";g.fillRect(9,6,10,8);g.fillRect(7,11,8,5)});
 tiles[4][v]=mk(g=>{base(g,"#7a7a7a");sp(g,["#5c5c5c","#9a9a9a"],7,8,5);g.fillStyle="#4a4a4a";g.fillRect(0,28,T,4)});
 tiles[5][v]=mk(g=>{base(g,"#a8a39a");g.fillStyle="#8a857c";for(let i=0;i<T;i+=8){g.fillRect(i,0,1,T);g.fillRect(0,i,T,1)}sp(g,["#b8b3aa"],4,3,3)});
 tiles[6][v]=mk(g=>{base(g,"#8b3a2b");g.fillStyle="#5a2218";for(let r=0;r<4;r++){g.fillRect(0,r*8,T,1);for(let i=(r%2)*8;i<T;i+=16)g.fillRect(i,r*8,1,8)}});
 tiles[7][v]=mk(g=>{base(g,"#8a5a2b");g.fillStyle="#6b4420";for(let i=0;i<T;i+=8)g.fillRect(0,i,T,1)});
}
// ----- estado -----
const P={x:CX,y:CY+3,rx:CX,ry:CY+3,dir:2,hp:100,max:100,xp:0,lvl:1,gold:0,name:"",col:"#c33",tgt:null,cd:0,rg:0};
const MT=[{n:"Rato",hp:20,d:[1,3],xp:8,g:3,a:5,r:12},{n:"Orc",hp:70,d:[4,9],xp:40,g:15,a:6,r:26}];
const mons=[],fts=[];let others={},vis={},started=false,db=null,ox=0,oy=0;const id=Math.random().toString(36).slice(2,9);
for(let k=0;mons.length<44&&k<5000;k++){const t=mons.length<26?0:1,a=Math.random()*W|0,y=Math.random()*H|0,tt=map[y][a];
 if((tt==2||tt==1)&&Math.max(Math.abs(a-CX),Math.abs(y-CY))>MT[t].r)mons.push({t,x:a,y,rx:a,ry:y,sx:a,sy:y,hp:MT[t].hp,cd:0,mv:Math.random(),dead:0})}
if(!online)["Eldrin","Mara","Gorn"].forEach((n,i)=>others["b"+i]={n,x:CX-3+i*3,y:CY+1,d:2,c:["#39c","#c3a","#cc3"][i],l:5+i,h:100,m:100,bot:1,mv:0});
function occ(a,y){if(mons.some(m=>!m.dead&&m.x==a&&m.y==y))return 1;for(const k in others)if(others[k].x==a&&others[k].y==y)return 1;return 0}
function free(a,y,mon){if(a<0||y<0||a>=W||y>=H)return 0;const t=map[y][a];if(solid(t)||(mon&&safeT(t)))return 0;if(mon&&P.x==a&&P.y==y)return 0;return!occ(a,y)}
function ft(a,y,txt,col){fts.push({x:a*T+16,y:y*T,t:txt,c:col,l:1})}
const lvlOf=()=>Math.floor(Math.sqrt(P.xp/40))+1;
// ----- chat -----
const log=$("log"),ci=$("ci");
function addChat(n,m,col){const d=document.createElement("div"),b=document.createElement("b");b.style.color=col||"#fc6";b.textContent=n+": ";d.append(b,m);log.append(d);log.scrollTop=1e9;while(log.children.length>60)log.firstChild.remove()}
function send(){const m=ci.value.trim().slice(0,100);ci.value="";if(!m)return;if(db)db.ref("chat").push({n:P.name,m,t:Date.now()});else addChat(P.name,m)}
// ----- rede -----
function push(){if(db)db.ref("players/"+id).set({n:P.name,x:P.x,y:P.y,d:P.dir,c:P.col,l:P.lvl,h:P.hp,m:P.max})}
function netInit(){try{firebase.initializeApp(FB);db=firebase.database();const r=db.ref("players/"+id);r.onDisconnect().remove();
 db.ref("players").on("value",s=>{others=s.val()||{};delete others[id]});
 db.ref("chat").limitToLast(20).on("child_added",s=>{const m=s.val();if(m&&m.n)addChat(String(m.n).slice(0,14),String(m.m).slice(0,100),m.n==P.name?"#fff":"#8cf")});
 setInterval(push,3000);addEventListener("beforeunload",()=>r.remove())}catch(e){db=null;$("st").textContent="Falha ao conectar: modo offline"}}
// ----- entrada -----
const K={};
addEventListener("keydown",e=>{if(e.key=="Enter"){if(document.activeElement==ci){send();ci.blur()}else if(started)ci.focus();return}
 if(document.activeElement==ci||document.activeElement==$("ni")){if(e.key=="Escape")ci.blur();return}
 K[e.key.toLowerCase()]=1;if(e.key.startsWith("Arrow")||e.key==" ")e.preventDefault()});
addEventListener("keyup",e=>delete K[e.key.toLowerCase()]);
document.querySelectorAll("#pad b").forEach(b=>{b.onpointerdown=()=>K[b.dataset.k]=1;b.onpointerup=b.onpointerleave=()=>delete K[b.dataset.k]});
c.addEventListener("pointerdown",e=>{if(!started)return;const r=c.getBoundingClientRect(),tx=Math.floor(((e.clientX-r.left)/r.width*480+ox)/T),ty=Math.floor(((e.clientY-r.top)/r.height*352+oy)/T);
 const m=mons.find(m=>!m.dead&&m.x==tx&&m.y==ty);P.tgt=m&&P.tgt!==m?m:null});
// ----- login -----
const cols=["#c33","#39c","#3a3","#c9a","#e90","#999"];
cols.forEach((k,i)=>{const s=document.createElement("span");s.className="sw"+(i?"":" s");s.style.background=k;s.onclick=()=>{P.col=k;document.querySelectorAll(".sw").forEach(z=>z.classList.remove("s"));s.classList.add("s")};$("sw").append(s)});
$("st").textContent=online?"Servidor online":"Modo offline (configure o Firebase para multiplayer)";
try{$("ni").value=localStorage.getItem("tn")||""}catch(e){}
$("go").onclick=()=>{P.name=$("ni").value.trim().slice(0,14)||"Aventureiro";try{localStorage.setItem("tn",P.name)}catch(e){}
 $("login").style.display="none";started=true;if(online)netInit();push();addChat("Sistema","Bem-vindo, "+P.name+"! Monstros ficam fora da cidade.","#6f6")};
// ----- lógica -----
function update(dt){
 P.rx+=cl(P.x-P.rx,5*dt);P.ry+=cl(P.y-P.ry,5*dt);
 const dv=K.w||K.arrowup?[0,-1,0]:K.s||K.arrowdown?[0,1,2]:K.a||K.arrowleft?[-1,0,3]:K.d||K.arrowright?[1,0,1]:null;
 if(dv&&Math.abs(P.x-P.rx)+Math.abs(P.y-P.ry)<.05&&document.activeElement!=ci){P.dir=dv[2];const nx=P.x+dv[0],ny=P.y+dv[1];if(free(nx,ny)){P.x=nx;P.y=ny;push()}}
 P.cd-=dt;const m=P.tgt;
 if(m&&!m.dead&&Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y))<=8){if(Math.max(Math.abs(m.x-P.x),Math.abs(m.y-P.y))<=1&&P.cd<=0){P.cd=1;const dm=4+P.lvl*2+(Math.random()*6|0);m.hp-=dm;ft(m.rx,m.ry,dm,"#fff");if(m.hp<=0){const d=MT[m.t];m.dead=15;P.xp+=d.xp;P.gold+=d.g;ft(m.rx,m.ry-.5,"+"+d.xp+"xp","#ff0");P.tgt=null;
  const nl=lvlOf();if(nl>P.lvl){P.lvl=nl;P.max=100+(nl-1)*15;P.hp=P.max;addChat("Sistema","Você alcançou o nível "+nl+"!","#6f6");push()}}}}else P.tgt=null;
 P.rg+=dt;if(P.rg>=2){P.rg=0;if(P.hp<P.max)P.hp=Math.min(P.max,P.hp+1+(P.lvl>>2))}
 for(const m of mons){const d=MT[m.t];
  if(m.dead){if((m.dead-=dt)<=0){m.dead=0;m.x=m.sx;m.y=m.sy;m.rx=m.x;m.ry=m.y;m.hp=d.hp}continue}
  m.rx+=cl(m.x-m.rx,3*dt);m.ry+=cl(m.y-m.ry,3*dt);m.mv-=dt;m.cd-=dt;
  const dx=P.x-m.x,dy=P.y-m.y,dist=Math.max(Math.abs(dx),Math.abs(dy)),sf=safeT(map[P.y][P.x]);
  if(dist<=1&&!sf){if(m.cd<=0){m.cd=1.3;const dm=d.d[0]+(Math.random()*(d.d[1]-d.d[0]+1)|0);P.hp-=dm;ft(P.rx,P.ry,dm,"#f55")}}
  else if(m.mv<=0){m.mv=.45;if(dist<=d.a&&!sf){const sx=Math.sign(dx),sy=Math.sign(dy),o=Math.abs(dx)>Math.abs(dy)?[[sx,0],[0,sy]]:[[0,sy],[sx,0]];
    for(const[a,b]of o)if((a||b)&&free(m.x+a,m.y+b,1)){m.x+=a;m.y+=b;break}}
   else if(Math.random()<.3){const a=(Math.random()*3|0)-1,b=a?0:(Math.random()*3|0)-1;if((a||b)&&Math.abs(m.x+a-m.sx)<6&&Math.abs(m.y+b-m.sy)<6&&free(m.x+a,m.y+b,1)){m.x+=a;m.y+=b}}}}
 if(P.hp<=0){P.xp=Math.floor(P.xp*.9);P.lvl=lvlOf();P.max=100+(P.lvl-1)*15;P.hp=P.max;P.x=P.rx=CX;P.y=P.ry=CY+3;P.tgt=null;addChat("Sistema","Você morreu e perdeu 10% de XP.","#f66");push()}
 for(const k in others){const o=others[k];if(o.bot){o.mv-=dt;if(o.mv<=0){o.mv=1+Math.random()*2;let a=(Math.random()*3|0)-1,b=a?0:(Math.random()*3|0)-1;if(Math.abs(o.x+a-CX)>8)a=-Math.sign(o.x-CX);if(Math.abs(o.y+b-CY)>8)b=-Math.sign(o.y-CY);if((a||b)&&free(o.x+a,o.y+b)&&!(P.x==o.x+a&&P.y==o.y+b)){o.x+=a;o.y+=b;o.d=b<0?0:b>0?2:a<0?3:1}}}
  const v=vis[k]||(vis[k]={rx:o.x,ry:o.y});v.rx+=cl(o.x-v.rx,5*dt);v.ry+=cl(o.y-v.ry,5*dt)}
 for(const k in vis)if(!others[k])delete vis[k];
 for(let i=fts.length-1;i>=0;i--){const f=fts[i];f.y-=24*dt;if((f.l-=dt)<=0)fts.splice(i,1)}
}
// ----- desenho -----
function label(t,px,py,col){x.font="bold 10px monospace";x.textAlign="center";x.lineWidth=3;x.strokeStyle="#000";x.strokeText(t,px,py);x.fillStyle=col;x.fillText(t,px,py)}
function hpbar(px,py,h,m){x.fillStyle="#000";x.fillRect(px+3,py-3,26,5);x.fillStyle=h/m>.5?"#3c3":h/m>.25?"#cc3":"#c33";x.fillRect(px+4,py-2,24*Math.max(0,h)/m,3)}
function ch(px,py,col,d,s){x.fillStyle="#0004";x.fillRect(px+7,py+27,18,4);x.fillStyle="#2a2a3a";x.fillRect(px+10,py+22,5,s?6:7);x.fillRect(px+17,py+22,5,s?7:6);
 x.fillStyle=col;x.fillRect(px+9,py+12,14,11);x.fillStyle="#f0c090";x.fillRect(px+6,py+13,3,8);x.fillRect(px+23,py+13,3,8);x.fillRect(px+10,py+3,12,10);
 x.fillStyle="#5a3a1a";x.fillRect(px+10,py+2,12,d==0?10:4);if(d!=0){x.fillStyle="#000";const e=d==3?-2:d==1?2:0;x.fillRect(px+12+e,py+8,2,2);x.fillRect(px+18+e,py+8,2,2)}}
function drawPl(o,rx,ry,t,self){const px=Math.round(rx*T-ox),py=Math.round(ry*T-oy),mv=Math.abs(o.x-rx)+Math.abs(o.y-ry)>.02;
 ch(px,py,o.c||"#c33",o.d||0,mv&&(t/150|0)%2);hpbar(px,py+2,o.h||100,o.m||100);label(o.n+" ["+(o.l||1)+"]",px+16,py-6,self?"#fff":"#8cf")}
function drawMon(m){const px=Math.round(m.rx*T-ox),py=Math.round(m.ry*T-oy);x.fillStyle="#0004";x.fillRect(px+4,py+26,24,4);
 if(m.t==0){x.fillStyle="#8c7a6a";x.fillRect(px+6,py+15,20,10);x.fillRect(px+3,py+13,9,9);x.fillStyle="#e9a0a0";x.fillRect(px+5,py+11,3,3);x.fillRect(px+9,py+11,3,3);x.fillStyle="#d00";x.fillRect(px+4,py+16,2,2);x.fillStyle="#d9a0a0";x.fillRect(px+26,py+19,5,2)}
 else{x.fillStyle="#3a2a1a";x.fillRect(px+9,py+22,5,7);x.fillRect(px+18,py+22,5,7);x.fillStyle="#4f8a3a";x.fillRect(px+7,py+10,18,13);x.fillStyle="#5fa04a";x.fillRect(px+10,py+1,12,10);
  x.fillStyle="#f00";x.fillRect(px+12,py+5,2,2);x.fillRect(px+18,py+5,2,2);x.fillStyle="#fff";x.fillRect(px+12,py+9,2,3);x.fillRect(px+18,py+9,2,3);x.fillStyle="#6b4423";x.fillRect(px+25,py+8,4,16)}
 hpbar(px,py+2,m.hp,MT[m.t].hp);label(MT[m.t].n,px+16,py-6,"#f88");
 if(P.tgt===m){x.strokeStyle="#f22";x.lineWidth=2;x.strokeRect(px+1,py+1,T-2,T-2)}}
function draw(t){
 x.fillStyle="#000";x.fillRect(0,0,480,352);ox=Math.round(P.rx*T+16-240);oy=Math.round(P.ry*T+16-176);
 const x0=Math.floor(ox/T),y0=Math.floor(oy/T);
 for(let ty=y0;ty<=y0+VH+1;ty++)for(let tx=x0;tx<=x0+VW+1;tx++){if(tx<0||ty<0||tx>=W||ty>=H)continue;const tt=map[ty][tx];x.drawImage(tiles[tt][tt==0?((t/600|0)+tx+ty)%3:(tx*7+ty*3)%3],tx*T-ox,ty*T-oy)}
 const E=[];for(const m of mons)if(!m.dead)E.push([m.ry,()=>drawMon(m)]);
 for(const k in others){const v=vis[k];if(v)E.push([v.ry,()=>drawPl(others[k],v.rx,v.ry,t)])}
 E.push([P.ry,()=>drawPl({n:P.name||"...",c:P.col,l:P.lvl,h:P.hp,m:P.max,d:P.dir,x:P.x,y:P.y},P.rx,P.ry,t,1)]);
 E.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
 for(const f of fts)label(f.t,f.x-ox,f.y-oy,f.c);
 const b=40*(P.lvl-1)**2,n=40*P.lvl**2;$("hb").style.width=P.hp/P.max*100+"%";$("xb").style.width=(P.xp-b)/(n-b)*100+"%";
 $("ht").textContent="HP "+P.hp+"/"+P.max+" · Nv "+P.lvl+" · Ouro "+P.gold+" · Online: "+(Object.keys(others).length+1)}
let last=0;(function f(t){const dt=Math.min(50,t-last)/1000;last=t;if(started)update(dt);draw(t);requestAnimationFrame(f)})(0);
</script></body></html>
